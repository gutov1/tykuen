version: '3.8'

services:
  tykuen-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tykuen-app
    ports:
      - '8080:80'
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
